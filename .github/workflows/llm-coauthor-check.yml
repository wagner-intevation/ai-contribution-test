name: LLM Co-author Check

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  check-llm-coauthors:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:  # fetch complete history, not just the last commit
          fetch-depth: 0

      - name: Check commits for LLM co-authors
        id: llm-check
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # LLM tool co-author patterns
          # GitHub Copilot example: Co-authored-by: GitHub Copilot <0000000+github-copilot[bot]@users.noreply.github.com>
          LLM_PATTERNS=(
            'Co-authored-by:.*copilot'
            'Co-authored-by:.*claude'
            'Co-authored-by:.*chatgpt'
            'Co-authored-by:.*gemini'
            'Co-authored-by:.*cursor'
            'Co-authored-by:.*tabnine'
            'Co-authored-by:.*codeium'
            'Co-authored-by:.*amazon q'
            'Co-authored-by:.*continue'
            'Co-authored-by:.*github-copilot\[bot\]'
            'Co-authored-by:.*175728472\+github-copilot'
            'generated.with.copilot'
            '\[generated by\].*copilot'
          )

          BOT_AUTHOR_PATTERNS=(
            'github-copilot\[bot\]'
            'copilot-swe-agent'
            'devin-ai-integration\[bot\]'
            'sweep-ai\[bot\]'
            'coderabbit-ai\[bot\]'
            'autofix-ci\[bot\]'
            'cursor-ai'
          )

          FOUND_COMMITS=""
          FOUND_ANY=false

          while IFS= read -r commit; do
            # Check commit messages
            msg=$(git show -s --format="%B" "$commit")
            author=$(git show -s --format="%an <%ae>" "$commit")
            subject=$(git show -s --format="%s" "$commit")

            for pattern in "${LLM_PATTERNS[@]}"; do
              if echo "$msg" | grep -iqE "$pattern"; then
                short=$(git show -s --format="%h" "$commit")
                FOUND_COMMITS="${FOUND_COMMITS}\n- \`${short}\` -${subject} (matched: \`${pattern}\`)"
                FOUND_ANY=true
                break
              fi
            done

            # Check commit authors
            bot_pattern=$(IFS='|'; echo "${BOT_AUTHOR_PATTERNS[*]}")
            if echo "$author" | grep -iqE "$bot_pattern"; then
              short=$(git show -s --format="%h" "$commit")
              FOUND_COMMITS="${FOUND_COMMITS}\n- \`${short}\` -${subject} (LLM bot author: ${author})"
              FOUND_ANY=true
            fi
          done < <(git log --format="%H" "${BASE_SHA}..${HEAD_SHA}")

          if $FOUND_ANY; then
            echo "LLM co-authorship detected in the following commits:" >&2
            echo -e "$FOUND_COMMITS" >&2
            {
              echo "### LLM co-authorship detected"
              echo ""
              echo "One or more commits appear to have been (co-)authored by an LLM tool:"
              echo ""
              echo -e "$FOUND_COMMITS"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
