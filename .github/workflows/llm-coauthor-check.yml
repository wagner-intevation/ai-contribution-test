name: Check for AI co-authorships

on:
  pull_request:

permissions: {}

jobs:
  ai-coauthorship-check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: Intevation/ai-contribution-action@main
        with:
          comment-on-detection: true
