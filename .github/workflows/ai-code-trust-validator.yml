name: AI Code Trust Check
on: [pull_request]

jobs:
  trust-check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Validate AI Code
        uses: rudra496/ai-code-trust-validator@v0.5.1
        with:
          path: '.'
          min-score: '75'
          format: 'sarif'
